<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rubik:ital,wght@0,300..900;1,300..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./css/styles.css">
  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  
  <title>Frontend Mentor | Time tracking dashboard</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <style>
    .attribution { font-size: 0.6875rem; text-align: center; }
    .attribution a { color: hsl(228, 45%, 44%); }
  </style>
</head>
<body>
  <main>
    <section class="profile">
      <div class="profile-card">
        <img src="images/image-jeremy.png" alt="Portrait of Jeremy Robson" class="profile-picture">
        <div class="profile-desc">
          <p>Report for</p>
          <h1>Jeremy Robson</h1>
        </div>
      </div>
      <div class="time-tracking-options-menu">
        <button type="button">Daily</button>
        <button class="is-selected" type="button">Weekly</button>
        <button type="button">Monthly</button>
      </div>
    </section>
    <section class="activity-card-grid">
      <article class="activity-card activity-card--work">
        <div class="activity-card-content">
          <div class="time-tracking-header">
            <h2>Work</h2>
            <button class="icon-button" type="button" aria-label="More options for Work">
              <svg width="21" height="5" xmlns="http://www.w3.org/2000/svg"><path d="M2.5 0a2.5 2.5 0 1 1 0 5 2.5 2.5 0 0 1 0-5Zm8 0a2.5 2.5 0 1 1 0 5 2.5 2.5 0 0 1 0-5Zm8 0a2.5 2.5 0 1 1 0 5 2.5 2.5 0 0 1 0-5Z" fill="currentColor" fill-rule="evenodd"/></svg>
            </button>
          </div>
          <div class="time-tracking-summary">
            <p class="time-tracking-summary-text">32hrs</p>
            <p class="time-tracking-summary-subtext">Last Week - 36hrs</p>
          </div>
        </div>
      </article>
      <article class="activity-card activity-card--play">
        <div class="time-tracking-header">
          <h2>Play</h2>
          <button class="icon-button" type="button" aria-label="More options for Play">
            <img src="images/icon-ellipsis.svg" alt="">
          </button>
        </div>
        <div class="time-tracking-summary">
          <p>10hrs</p>
          <p class="time-tracking-summary-subtext">Last Week - 8hrs</p>
        </div>
      </article>
      <article class="activity-card activity-card--study">
        <div class="time-tracking-header">
          <h2>Study</h2>
          <button class="icon-button" type="button" aria-label="More options for Study">
            <img src="images/icon-ellipsis.svg" alt="">
          </button>
        </div>
        <div class="time-tracking-summary">
          <p>4hrs</p>
          <p class="time-tracking-summary-subtext">Last Week - 7hrs</p>
        </div>
      </article>
      <article class="activity-card activity-card--exercise">
        <div class="time-tracking-header">
          <h2>Exercise</h2>
          <button class="icon-button" type="button" aria-label="More options for Exercise">
            <img src="images/icon-ellipsis.svg" alt="">
          </button>
        </div>
        <div class="time-tracking-summary">
          <p>4hrs</p>
          <p class="time-tracking-summary-subtext">Last Week - 5hrs</p>
        </div>
      </article>
      <article class="activity-card activity-card--social">
        <div class="time-tracking-header">
          <h2>Social</h2>
          <button class="icon-button" type="button" aria-label="More options for Social">
            <img src="images/icon-ellipsis.svg" alt="">
          </button>
        </div>
        <div class="time-tracking-summary">
          <p>5hrs</p>
          <p class="time-tracking-summary-subtext">Last Week - 10hrs</p>
        </div>
      </article>
      <article class="activity-card activity-card--self-care">
        <div class="time-tracking-header">
          <h2>Self Care</h2>
          <button class="icon-button" type="button" aria-label="More options for Self Care">
            <img src="images/icon-ellipsis.svg" alt="">
          </button>
        </div>
        <div class="time-tracking-summary">
          <p>2hrs</p>
          <p class="time-tracking-summary-subtext">Last Week - 2hrs</p>
        </div>
      </article>
    </section>
  </main>
</body>
</html>
